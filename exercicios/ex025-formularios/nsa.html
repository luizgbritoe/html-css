<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSA - Online</title>
</head>
<body>
    <h1>NSA ONLINE</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="irm">RM: </label>
            <input type="number" name="RM" id="irm" required minlength="5" maxlength="5">
        </p>
        
        <p>
            <label for="icod_etec">Código da Etec: </label>
            <input type="number" name="cod_etec" id="icod_etec" required maxlength="3">
        </p>

        <p>
            <label for="isenha">Senha: </label>
            <input type="password" name="senha" id="senha"  required autocomplete="current-password">
        </p>

        <p>
            <input type="submit" value="Entrar">
        </p>
    </form>

    <a href="#">Esqueceu a senha?</a>
</body>
</html>
